# doc-scraper Configuration
# 3 working examples demonstrating all configuration variations
#
# Output is two artifacts: the Markdown files, and an optional JSONL file.
# The JSONL file carries one record per page plus a final crawl_meta summary
# record (record_type: "crawl_meta"); consumers tell them apart via record_type.

# --- Global Settings ---
default_delay_per_host: 500ms
num_workers: 6
num_image_workers: 4
max_requests: 48
max_requests_per_host: 4
output_base_dir: "./crawled_docs"
state_dir: "./crawler_state"

# Retry settings
max_retries: 3
initial_retry_delay: 1s
max_retry_delay: 30s

# Timeout settings
global_crawl_timeout: 0s        # 0 = no timeout
per_page_timeout: 60s           # Per-page timeout

# Size limits
max_page_size_bytes: 52428800   # 50 MiB (max HTML page body size, 0 = 50 MiB default)
max_image_size_bytes: 10485760  # 10 MiB (applies only when images are downloaded)

# Global image defaults
# Image downloading is opt-in. When skip_images is unset, images are skipped
# (doc-scraper is text-first for LLMs). Set to false here, or per-site, to
# download and localize images for offline consumption.
skip_images: true

# JSONL output: one record per page plus a final crawl_meta summary record.
enable_jsonl_output: true
jsonl_output_filename: "pages.jsonl"

# Incremental crawling (skip unchanged pages)
# enable_incremental: false

# HTTP client settings (only the three knobs real users tune are exposed;
# pool, dialer, and TLS timings are baked into pkg/fetch with sane defaults).
http_client_settings:
  timeout: 45s
  max_idle_conns_per_host: 6
  # allow_private_networks: false   # set true ONLY to crawl internal docs (disables SSRF guard)

# --- Site Configurations ---
sites:

  # ============================================================================
  # EXAMPLE 1: flask_docs
  # - Auto content detection (Sphinx framework auto-detected)
  # - Images downloaded with domain filtering (opt-in)
  # - Polite rate limiting
  # ============================================================================
  flask_docs:
    start_urls:
      - "https://flask.palletsprojects.com/en/stable/"
    allowed_domain: "flask.palletsprojects.com"
    allowed_path_prefix: "/en/stable/"

    # AUTO: Detects Sphinx framework automatically
    content_selector: "auto"

    # Depth: seed is depth 0; max_depth is the exclusive upper bound, so
    # max_depth=2 fetches depth 0 and 1 (seed plus one level). max_depth=0
    # means unlimited.
    max_depth: 2
    delay_per_host: 500ms           # Polite crawling
    respect_nofollow: true

    # Image handling: opt in to downloading images for this site
    skip_images: false
    max_image_size_bytes: 5242880   # 5 MiB limit
    allowed_image_domains:
      - "flask.palletsprojects.com"
      - "*.palletsprojects.com"

    # Exclude API reference (too large)
    disallowed_path_patterns:
      - "/en/stable/api/.*"
      - "/en/stable/changes/.*"

  # ============================================================================
  # EXAMPLE 2: click_docs
  # - Explicit CSS selector for Pallets/Flask-style docs
  # - Text-only (images skipped, the default)
  # - Limited depth, fast crawling
  # ============================================================================
  click_docs:
    start_urls:
      - "https://click.palletsprojects.com/en/stable/"
    allowed_domain: "click.palletsprojects.com"
    allowed_path_prefix: "/en/stable/"

    # EXPLICIT: Pallets docs use this structure
    content_selector: "div.body, article"

    max_depth: 2                    # seed + one level (see depth note above)
    delay_per_host: 300ms           # Faster crawling
    respect_nofollow: false         # Follow all links

  # ============================================================================
  # EXAMPLE 3: rust_cli_book
  # - Explicit selector for mdBook framework
  # - Custom link extraction selectors
  # - Moderate settings
  # ============================================================================
  rust_cli_book:
    start_urls:
      - "https://rust-cli.github.io/book/index.html"
    allowed_domain: "rust-cli.github.io"
    allowed_path_prefix: "/book/"

    # EXPLICIT: mdBook content selector
    content_selector: "#content, main"

    # mdBook navigation structure
    link_extraction_selectors:
      - "nav#sidebar"
      - "nav.nav-wrapper"
      - "main#content"

    max_depth: 0                    # unlimited (see depth note above)
    delay_per_host: 500ms           # Default delay
    respect_nofollow: true

    # Exclude print page and non-content
    disallowed_path_patterns:
      - "/book/print\\.html$"
      - "/book/.*\\?.*"
