name: Docs

# Runs on every pull request so the docs check can be required: a workflow
# skipped by a paths filter leaves a required check pending, while skipped steps
# still report success. The docs job decides itself whether the site changed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "pkg/detect/**"
      - "pkg/discover/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/docs-dogfood.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for each page's "Last updated" date
      # Keep the pattern in sync with the push paths above.
      - name: Detect docs changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the PR merge commit; its first parent is the base branch.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(docs/|demo/|pkg/detect/|pkg/discover/|\.github/workflows/docs\.yml$|\.github/scripts/docs-dogfood\.sh$)' <<<"$changed"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs-related files changed; skipping the docs build."
          fi
      - if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - if: steps.changes.outputs.docs == 'true'
        name: Install
        working-directory: docs
        run: npm ci
      # starlight-links-validator fails this step on any broken internal link.
      - if: steps.changes.outputs.docs == 'true'
        name: Build
        working-directory: docs
        run: npm run build
      - if: steps.changes.outputs.docs == 'true'
        uses: ./.github/actions/setup-go
      - if: steps.changes.outputs.docs == 'true'
        name: Build doc-scraper
        run: go build -o "$RUNNER_TEMP/doc-scraper" ./cmd/doc-scraper
      - if: steps.changes.outputs.docs == 'true'
        name: Dogfood check
        run: .github/scripts/docs-dogfood.sh "$RUNNER_TEMP/doc-scraper" docs/dist
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
