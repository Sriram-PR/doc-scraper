name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/Sriram-PR/doc-scraper/issues?q=is%3Aissue) first. Please write this yourself; see the [AI policy](https://github.com/Sriram-PR/doc-scraper/blob/main/CONTRIBUTING.md#ai-assisted-contributions).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. Which site, workflow, or tool hit the limitation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've tried
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
